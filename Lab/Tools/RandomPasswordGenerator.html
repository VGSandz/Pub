<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password generator</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#cfd7de;--acc:#1f5fd6;--acc-ink:#fff;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--panel:#17212c;--ink:#e6edf3;--mute:#93a4b4;--line:#2b394a;--acc:#5b93ff;--acc-ink:#0b1220;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:14px}
.row:last-child{margin-bottom:0}
label{display:flex;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
.field span{color:var(--mute);font-size:.875rem}
input[type=text],input[type=number],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.out{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.out:last-child{border-bottom:0}
.out code{flex:1;font:1.15rem/1.4 ui-monospace,"Cascadia Mono",Consolas,monospace;word-break:break-all}
.meta{color:var(--mute);font-size:.875rem;margin-top:12px}
#err{color:var(--bad);min-height:1.5em}
</style>
</head>
<body>
<main>
<h1>Password generator</h1>
<p class="sub">Runs in your browser with the Web Crypto random source. Nothing is sent anywhere.</p>

<section class="card" aria-label="Options">
  <div class="row">
    <label for="len" style="min-width:90px">Length</label>
    <input id="len" type="range" min="4" max="128" value="16">
    <strong id="lenv">16</strong>
  </div>
  <div class="row">
    <label><input id="lower" type="checkbox" checked> Lowercase</label>
    <label><input id="upper" type="checkbox" checked> Uppercase</label>
    <label><input id="digit" type="checkbox" checked> Digits</label>
    <label><input id="special" type="checkbox" checked> Symbols</label>
  </div>
  <div class="row">
    <div class="field"><span>Symbols to use</span><input id="symbols" type="text" value="-~!@#$%^&*_+=)}:;&quot;'>,.?]" spellcheck="false"></div>
    <div class="field"><span>Must include one of these characters (optional)</span><input id="extra" type="text" spellcheck="false"></div>
  </div>
  <div class="row">
    <label><input id="ambig" type="checkbox"> Exclude look-alikes (I l 1 O 0 o)</label>
    <div class="field" style="flex:0 1 150px"><span>Max identical in a row</span><input id="maxc" type="number" min="0" max="8" value="2"></div>
    <div class="field" style="flex:0 1 110px"><span>How many</span>
      <select id="count"><option>1</option><option>5</option><option>10</option></select></div>
  </div>
  <div class="row">
    <div class="field"><span>Site rules (passwordrules syntax)</span>
      <input id="rules" type="text" placeholder="minlength: 8; maxlength: 20; required: lower, upper, digit; max-consecutive: 2" spellcheck="false"></div>
    <button id="apply" type="button">Apply rules</button>
  </div>
</section>

<section class="card" aria-live="polite">
  <div id="err"></div>
  <div id="list"></div>
  <div class="meta" id="meta"></div>
  <div class="row" style="margin-top:16px"><button id="go" class="primary" type="button">Generate again</button></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const SETS = {lower:"abcdefghijklmnopqrstuvwxyz", upper:"ABCDEFGHIJKLMNOPQRSTUVWXYZ", digit:"0123456789"};
const AMBIG = "Il1O0o";

// Unbiased random integer in [0, n) using rejection sampling.
function rnd(n){
  const max = Math.floor(0x100000000 / n) * n, b = new Uint32Array(1);
  do { crypto.getRandomValues(b); } while (b[0] >= max);
  return b[0] % n;
}
const uniq = s => [...new Set(s)].join("");

function classes(){
  const ex = $("ambig").checked ? AMBIG : "";
  const clean = s => uniq([...s].filter(c => !ex.includes(c) && !/\s/.test(c)).join(""));
  const out = [];
  for (const k of ["lower","upper","digit"]) if ($(k).checked) out.push(clean(SETS[k]));
  if ($("special").checked) out.push(clean($("symbols").value));
  out.push(clean($("extra").value));
  return out.filter(Boolean);
}

function runOk(p, m){
  let r = 1;
  for (let i = 1; i < p.length; i++){ r = p[i] === p[i-1] ? r + 1 : 1; if (r > m) return false; }
  return true;
}

// Same approach as Firefox: one character from each required class,
// fill the rest from the combined pool, shuffle, then check the run limit.
function generate(){
  const cls = classes();
  if (!cls.length) throw new Error("Select at least one character type.");
  const len = +$("len").value;
  if (len < cls.length) throw new Error("Length must be at least " + cls.length + " for the selected types.");
  const pool = uniq(cls.join("")), maxc = +$("maxc").value;
  for (let t = 0; t < 500; t++){
    const ch = cls.map(c => c[rnd(c.length)]);
    while (ch.length < len) ch.push(pool[rnd(pool.length)]);
    for (let i = ch.length - 1; i > 0; i--){ const j = rnd(i + 1); [ch[i], ch[j]] = [ch[j], ch[i]]; }
    const p = ch.join("");
    if (!maxc || runOk(p, maxc)) return {p, size: pool.length};
  }
  throw new Error("Could not meet the max-identical limit. Raise it or add character types.");
}

function render(){
  $("lenv").textContent = $("len").value;
  const list = $("list"); list.textContent = ""; $("err").textContent = ""; $("meta").textContent = "";
  try {
    let size = 0;
    for (let i = 0; i < +$("count").value; i++){
      const r = generate(); size = r.size;
      const row = document.createElement("div"); row.className = "out";
      const code = document.createElement("code"); code.textContent = r.p;
      const btn = document.createElement("button"); btn.type = "button"; btn.textContent = "Copy";
      btn.onclick = async () => {
        try { await navigator.clipboard.writeText(r.p); btn.textContent = "Copied"; }
        catch { btn.textContent = "Copy failed"; }
        setTimeout(() => btn.textContent = "Copy", 1500);
      };
      row.append(code, btn); list.append(row);
    }
    const bits = Math.floor(+$("len").value * Math.log2(size));
    $("meta").textContent = size + " possible characters, about " + bits + " bits of entropy (upper bound).";
  } catch (e) { $("err").textContent = e.message; }
}

function applyRules(){
  const m = {};
  $("rules").value.split(";").forEach(part => {
    const i = part.indexOf(":");
    if (i > 0) m[part.slice(0, i).trim().toLowerCase()] = part.slice(i + 1).trim();
  });
  let len = +$("len").value;
  if (m.minlength) len = Math.max(len, +m.minlength || 0);
  if (m.maxlength) len = Math.min(len, +m.maxlength || 128);
  $("len").value = Math.min(128, Math.max(4, len));
  if ("max-consecutive" in m) $("maxc").value = Math.min(8, +m["max-consecutive"] || 0);
  if (m.required){
    const want = new Set(), extra = [];
    for (const t of m.required.matchAll(/\[(.*?)\]|([a-z]+)/gi)){
      if (t[1] !== undefined) extra.push(t[1]); else want.add(t[2].toLowerCase());
    }
    for (const k of ["lower","upper","digit","special"]) $(k).checked = want.has(k);
    $("extra").value = extra.join("");
  }
  render();
}

document.querySelectorAll("#len,#lower,#upper,#digit,#special,#symbols,#extra,#ambig,#maxc,#count")
  .forEach(el => el.addEventListener("input", render));
$("go").onclick = render;
$("apply").onclick = applyRules;
render();
</script>
</body>
</html>
